[package]
name = "zte-esim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-demand eSIM card helper for zte-agent (SGP.22 profile switching and receipts)"
publish = false

[dependencies]
# SGP.22 card commands: LGPL-2.1-only Rust translation of lpac's libeuicc (see euicc/).
euicc = { path = "../euicc" }
libc = "0.2"
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
