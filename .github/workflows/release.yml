name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install zig
        run: |
          pipx install ziglang
          PIPX_BIN="$(pipx environment --value PIPX_BIN_DIR)"
          ls -l "$PIPX_BIN"
          # ziglang >= 0.16 ships the binary as python-zig; cargo-zigbuild expects zig
          if [ ! -e "$PIPX_BIN/zig" ] && [ -e "$PIPX_BIN/python-zig" ]; then
            ln -s "$PIPX_BIN/python-zig" "$PIPX_BIN/zig"
          fi
          echo "$PIPX_BIN" >> "$GITHUB_PATH"
          "$PIPX_BIN/zig" version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build zte-agent and zte-esim
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p zte-agent -p zte-esim --locked

      - name: Sanity-check binaries
        run: |
          for BIN in target/aarch64-unknown-linux-musl/release/zte-agent target/aarch64-unknown-linux-musl/release/zte-esim; do
            file "$BIN"
            readelf -h "$BIN" | grep -E 'Class|Machine|Type'
            readelf -d "$BIN" || true
            ls -l "$BIN"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: zte-agent
          path: target/aarch64-unknown-linux-musl/release/zte-agent

      - uses: actions/upload-artifact@v4
        with:
          name: zte-esim
          path: target/aarch64-unknown-linux-musl/release/zte-esim

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build dashboard
        working-directory: web-app
        run: |
          npm ci
          npm run build

      - name: Package dist
        run: tar czf dashboard-dist.tar.gz -C web-app/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist.tar.gz

  publish:
    needs: [agent, dashboard, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir assets
          cp artifacts/zte-agent/zte-agent assets/zte-agent
          cp artifacts/zte-esim/zte-esim assets/zte-esim
          # zte-esim links the LGPL-2.1 euicc library: ship its license and the notices.
          cp euicc/LICENSE assets/LICENSE-LGPL-2.1.txt
          cp THIRD_PARTY_NOTICES.md assets/THIRD_PARTY_NOTICES.md
          cp artifacts/dashboard-dist/dashboard-dist.tar.gz assets/
          python3 - <<'PYTHON'
          import os
          import zipfile
          from pathlib import Path
          images = sorted((Path('docs/images') / ('installer-' + os.environ['GITHUB_REF_NAME'])).glob('*.png'))
          assert len(images) == 5, 'Installer wireframes are incomplete'
          with zipfile.ZipFile('assets/installer-wireframes.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for image in images: archive.write(image, image.name)
          PYTHON
          cd assets
          sha256sum zte-agent zte-esim dashboard-dist.tar.gz installer-wireframes.zip LICENSE-LGPL-2.1.txt THIRD_PARTY_NOTICES.md > sha256sums.txt
          cat sha256sums.txt

      - name: Release notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Pre-built artifacts for the ZTE U60 Pro (MU5250).

          **Assets**

          - `zte-agent` — agent binary (aarch64 musl). Deploy to `/data/zte-agent`,
            or run `bash setup.sh` and choose the pre-built download.
          - `zte-esim` — the agent's on-demand eSIM helper (aarch64 musl), deployed
            with the agent to `/data/zte-esim`. It links the LGPL-2.1 `euicc`
            library; see `THIRD_PARTY_NOTICES.md` and `LICENSE-LGPL-2.1.txt`.
            The complete corresponding source is this release's tag.
          - `dashboard-dist.tar.gz` — dashboard static build consumed by the
            native installer. For terminal deployment, run `scripts/zharden.sh`
            once to install the isolated dashboard server, then use
            `deploy-dashboard.sh`; do not add a second ZTE uhttpd UCI instance.
          - `sha256sums.txt` — SHA-256 checksums.

          **Verify**

          ```sh
          sha256sum -c sha256sums.txt
          ```
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARGS=(--draft --title "$TAG" --notes-file release-notes.md --generate-notes)
          case "$TAG" in *-rc*) ARGS+=(--prerelease) ;; esac
          gh release create "$TAG" "${ARGS[@]}" assets/*
